name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm test

      # The committed pixel art must match what the generator produces, so a
      # sprite edit can never land without the PNGs being regenerated.
      - name: icons are up to date
        run: |
          npm run icons
          git diff --exit-code -- icons assets
